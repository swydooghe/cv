
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Stan Wydooghe – CV</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #fff;
      color: #111;
      font-family: Arial, sans-serif;
    }

    .loading,
    .error {
      max-width: 900px;
      margin: 80px auto;
      padding: 0 24px;
      line-height: 1.5;
    }

    .error {
      color: #a00;
    }
  </style>
</head>
<body>
  <div class="loading">Loading CV…</div>

  <script>
    const url = "https://raw.githubusercontent.com/swydooghe/cv/main/cv.html?v=" + Date.now();

    fetch(url)
      .then(response => {
        if (!response.ok) {
          throw new Error("HTTP " + response.status);
        }
        return response.text();
      })
      .then(html => {
        document.open();
        document.write(html);
        document.close();
      })
      .catch(err => {
        document.body.innerHTML =
          '<div class="error"><h1>Failed to load CV</h1><p>' +
          String(err) +
          '</p></div>';
        console.error(err);
      });
  </script>
</body>
</html>
